      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: kernel-${{ github.event.inputs.SU }}-${{ github.event.inputs.SUSFS }}-${{ github.event.inputs.BBR }}-${{ github.event.inputs.DroidSpace }}-${{ github.event.inputs.nomount }}
        max-size: 5G

 
    - name: Configure and build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_HOST=coolapk@sanba
        export KBUILD_BUILD_USER=GitHub@sanba0519

        make -j$(nproc --all) O=out ARCH=arm64 mt6853-ss_defconfig

        # DroidSpace
        if [ "${{ github.event.inputs.DroidSpace }}" = "true" ]; then
          echo "启用 DroidSpace..."
          ./scripts/config --file out/.config \
            --enable SYSCTL \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable PID_NS \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable NET_NS \
            --enable MULTIUSER \
            --enable USER_NS \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable SECCOMP \
            --enable SECCOMP_FILTER \
            --enable CGROUPS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_PIDS \
            --enable MEMCG \
            --enable CGROUP_SCHED \
            --enable FAIR_GROUP_SCHED \
            --enable CGROUP_FREEZER \
            --enable CGROUP_NET_PRIO \
            --enable OVERLAY_FS \
            --enable TMPFS_POSIX_ACL \
            --enable TMPFS_XATTR \
            --enable FW_LOADER \
            --enable FW_LOADER_USER_HELPER \
            --enable FW_LOADER_COMPRESS \
            --enable VETH \
            --enable BRIDGE \
            --enable NETFILTER \
            --enable BRIDGE_NETFILTER \
            --enable NETFILTER_ADVANCED \
            --enable NF_CONNTRACK \
            --enable IP_NF_IPTABLES \
            --enable IP_NF_FILTER \
            --enable NF_NAT \
            --enable NF_TABLES \
            --enable IP_NF_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_MASQUERADE \
            --enable NETFILTER_XT_TARGET_TCPMSS \
            --enable NETFILTER_XT_MATCH_ADDRTYPE \
            --enable NF_CONNTRACK_NETLINK \
            --enable NF_NAT_REDIRECT \
            --enable IP_ADVANCED_ROUTER \
            --enable IP_MULTIPLE_TABLES \
            --enable NF_CONNTRACK_IPV4 \
            --enable NF_NAT_IPV4 \
            --enable IP_NF_NAT \
            --enable NETFILTER_XT_MATCH_COMMENT \
            --enable NETFILTER_XT_MATCH_STATE \
            --enable NETFILTER_XT_MATCH_CONNTRACK \
            --enable NETFILTER_XT_MATCH_MULTIPORT \
            --enable NETFILTER_XT_MATCH_HL \
            --enable NETFILTER_XT_TARGET_REJECT \
            --enable IP_NF_TARGET_REJECT \
            --enable NETFILTER_XT_TARGET_LOG \
            --enable IP_NF_TARGET_ULOG \
            --enable NETFILTER_XT_MATCH_RECENT \
            --enable NETFILTER_XT_MATCH_LIMIT \
            --enable NETFILTER_XT_MATCH_HASHLIMIT \
            --enable NETFILTER_XT_MATCH_OWNER \
            --enable NETFILTER_XT_MATCH_PKTTYPE \
            --enable NETFILTER_XT_MATCH_MARK \
            --enable NETFILTER_XT_TARGET_MARK \
            --enable IP_SET \
            --enable IP_SET_HASH_IP \
            --enable IP_SET_HASH_NET \
            --enable NETFILTER_XT_SET \
            --enable NETFILTER_NETLINK_QUEUE \
            --enable NETFILTER_NETLINK_LOG \
            --enable NETFILTER_XT_TARGET_NFLOG \
            --disable ANDROID_PARANOID_NETWORK
          make O=out olddefconfig
        else
          echo "不启用 DroidSpace，使用默认配置"
        fi

        # BBR
        if [ "${{ github.event.inputs.BBR }}" = "true" ]; then
          echo "启用 BBR..."
          ./scripts/config --file out/.config \
            --enable CONFIG_TCP_CONG_BBR \
            --enable CONFIG_NET_SCH_FQ
          make O=out olddefconfig
        else
          echo "不启用 BBR..."
        fi

        # 最终配置修正
        # DroidSpace 需要 USER_NS（docker unsafe procfs 修复），仅在启用时保留
        if [ "${{ github.event.inputs.DroidSpace }}" = "true" ]; then
          ./scripts/config --file out/.config \
                  --enable CONFIG_NAMESPACES \
                  --enable CONFIG_DEVTMPFS \
                  --enable CONFIG_USER_NS \
                  --enable CONFIG_DEVTMPFS_MOUNT \
                  --enable CONFIG_SECTION_MISMATCH_WARN_ONLY
        else
          ./scripts/config --file out/.config \
                  --enable CONFIG_NAMESPACES \
                  --enable CONFIG_DEVTMPFS \
                  --disable CONFIG_USER_NS \
                  --enable CONFIG_DEVTMPFS_MOUNT \
                  --enable CONFIG_SECTION_MISMATCH_WARN_ONLY
        fi

        # KernelSU 和 SUSFS 配置
        # 如果启用了 SUSFS，无论哪个 SU 都必须启用 CONFIG_KSU_SUSFS
        if [ "${{ github.event.inputs.SUSFS }}" = "true" ]; then
          echo "KSU_LOG: 启用 CONFIG_KSU + CONFIG_KSU_SUSFS"
          ./scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --disable CONFIG_KSU_MANUAL_HOOK \
            --disable CONFIG_KSU_TRACEPOINT_HOOK
        elif [ "${{ github.event.inputs.SU }}" = "BakaSU" ]; then
          echo "KSU_LOG: BakaSU 不启用 SUSFS，使用 manual hook"
          ./scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_MANUAL_HOOK \
            --disable CONFIG_KSU_SUSFS \
            --disable CONFIG_KSU_TRACEPOINT_HOOK
        elif [ "${{ github.event.inputs.SU }}" = "7kimisu" ]; then
          echo "KSU_LOG: 7kimisu：Kconfig 仅有 CONFIG_KSU（SUSFS 选项由 compat 脚本注入，见上方分支）"
          ./scripts/config --file out/.config --enable CONFIG_KSU
        fi


        if [ "${{ github.event.inputs.nomount }}" = "true" ]; then
          echo "启用 NoMount..."
          ./scripts/config --file out/.config \
            --enable CONFIG_NOMOUNT \
            --enable CONFIG_KEYS
        else
          echo "不启用 NoMount..."
          ./scripts/config --file out/.config --disable CONFIG_NOMOUNT
        fi

        make O=out ARCH=arm64 olddefconfig

        if [ "${{ github.event.inputs.nomount }}" = "true" ]; then
          grep -qx 'CONFIG_NOMOUNT=y' out/.config \
            && grep -qx 'CONFIG_KEYS=y' out/.config \
            || { echo "NoMount 或 CONFIG_KEYS 配置未生效，终止编译"; exit 1; }
        elif grep -Eq '^CONFIG_NOMOUNT=(y|m)$' out/.config; then
          echo "NoMount 未关闭，终止编译"
          exit 1
        fi

        # 编译（显式目标，避免依赖默认 all 的行为差异）
        make -j"$(nproc)" \
                O=out \
                ARCH=arm64 \
                CC="ccache clang" \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-android- \
                CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                CFLAGS_KERNEL="-fintegrated-as" \
                CFLAGS_MODULE="-fintegrated-as" \
                LD=ld.lld \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                Image.gz-dtb

        # 构建自检：产物存在且 KSU 符号在 vmlinux 中（防 ccache 假完成）
        test -s out/arch/arm64/boot/Image.gz-dtb || { echo "Image.gz-dtb 缺失或为空"; exit 1; }
        ls -lh out/arch/arm64/boot/Image.gz-dtb
        aarch64-linux-gnu-nm out/vmlinux | grep -q " ksu_" \
          || { echo "vmlinux 中无 KSU 符号，构建异常"; exit 1; }

    - name: Generate artifact name
      id: gen_name
      run: |
        if [ "${{ github.event.inputs.SU }}" = "BakaSU" ]; then
          NAME="MT6853-BakaSU"
        else
          NAME="MT6853-RKSU"
        fi
        if [ "${{ github.event.inputs.BBR }}" = "true" ]; then
          NAME="${NAME}-BBR"
        fi
        if [ "${{ github.event.inputs.DroidSpace }}" = "true" ]; then
          NAME="${NAME}-DroidSpace"
        fi
        if [ "${{ github.event.inputs.SUSFS }}" = "true" ]; then
          NAME="${NAME}-SUSFS"
        fi
        if [ "${{ github.event.inputs.nomount }}" = "true" ]; then
          NAME="${NAME}-NoMount"
        fi
        echo "artifact_name=${NAME}" >> $GITHUB_OUTPUT
                
    - name: Package AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/sanba0519/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

        ZIP_NAME="${{ steps.gen_name.outputs.artifact_name }}.zip"
        (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}" .)
        ls -lh "${ZIP_NAME}"

    - name: Upload AnyKernel3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{steps.gen_name.outputs.artifact_name}}
        path: |
          kernel_workspace/AnyKernel3/*
          !kernel_workspace/AnyKernel3/*.zip

    - name: Generate Telegram caption
      id: gen_caption
      run: |

        COMMIT_SHA=$(git rev-parse --short HEAD)
        COMMIT_MSG=$(git log -1 --pretty=format:'%s')
        {
          echo "caption<<EOF"
          echo "<pre>"
          echo "🔧 Commit: ${COMMIT_SHA} - ${COMMIT_MSG}"
          echo ""
          echo "Kernel Info:"
          echo ""
          echo "欧加真我 MT6853 通用内核 -- A12"
          echo "Oplus/Realme MT6853 Universal Kernel -- A12"
          echo ""
          echo "📦 Feature:"
          if [ "${{ github.event.inputs.SU }}" = "RKSU" ]; then
            echo "Root方案:  RKSU"
          else
            echo "Root方案:  BakaSU"
          fi
          if [ "${{ github.event.inputs.BBR }}" = "true" ]; then
            echo "✅ BBR"
          else
            echo "❌ BBR"
          fi
          if [ "${{ github.event.inputs.DroidSpace }}" = "true" ]; then
            echo "✅ DroidSpace"
          else
            echo "❌ DroidSpace"
          fi
          if [ "${{ github.event.inputs.SUSFS }}" = "true" ]; then
            echo "✅ SUSFS-V2.2.0"
          else
            echo "❌ SUSFS-V2.2.0"
          fi
          if [ "${{ github.event.inputs.nomount }}" = "true" ]; then
            echo "✅ NoMount"
          else
            echo "❌ NoMount"
          fi
          echo "</pre>"
          echo " "
          echo "Follow👉:@mt6853o"
          echo "Dev: @sanba_0519"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Upload to Telegram
      env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_CI_SESSION: ${{ secrets.BOT_CI_SESSION }}
          CAPTION: ${{ steps.gen_caption.outputs.caption }}
      run: |
        if [ "${{ github.event.inputs.TG }}" != "true" ]; then
          echo "------------跳过 Telegram 上传------------"
          exit 0
        fi

        ZIP_PATH="$GITHUB_WORKSPACE/kernel_workspace/${{ steps.gen_name.outputs.artifact_name }}.zip"
        if [ ! -f "$ZIP_PATH" ]; then
          echo "找不到待上传文件: $ZIP_PATH"
          ls -la "$GITHUB_WORKSPACE/kernel_workspace" || true
          exit 1
        fi

        echo "------------正在上传到 Telegram------------"
        pip3 install telethon
        python3 "$GITHUB_WORKSPACE/.github/bot.py" --caption "$CAPTION" "$ZIP_PATH"

      
      
